[package]
name = "ofm_server"
version = "0.2.0"
edition = "2021"
description = "OpenFootManager web (browser) backend — HTTP adapter over the shared game core"

[[bin]]
name = "ofm_server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

domain = { path = "../domain" }
engine = { path = "../engine" }
ofm_core = { path = "../ofm_core" }
db = { path = "../db" }
